[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-opt"
version = "0.1.2"
description = "Measure native coding-agent skills and validate cheaper, faster configurations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["litellm==1.100.1", "python-dotenv>=1.2.2,<2"]
license = "MIT"

[project.scripts]
harness-opt = "harness_opt.cli:main"

[tool.setuptools.packages.find]
include = ["harness_opt*"]

[tool.setuptools.package-data]
harness_opt = ["data/*.json"]
